<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Promiedos</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Fútbol</p>
      <h1>Promiedos</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Resultados</p><h1>Promiedos</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <form id="match-form" class="card form">
        <input id="league" placeholder="Liga (ej. Liga Profesional)" maxlength="40" />
        <input id="home" placeholder="Local" maxlength="30" required />
        <input id="away" placeholder="Visitante" maxlength="30" required />
        <input id="homeScore" type="number" placeholder="Goles local" value="0" min="0" />
        <input id="awayScore" type="number" placeholder="Goles visitante" value="0" min="0" />
        <select id="status"><option>Final</option><option>En vivo</option><option>Programado</option></select>
        <input id="time" placeholder="Minuto / hora" maxlength="10" />
        <button class="primary" type="submit">Agregar partido</button>
      </form>
      <p id="form-error" class="error" hidden></p>
      <div id="list"></div>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
